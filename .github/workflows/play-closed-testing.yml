name: Google Play closed testing

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write access creates the GitHub release for each new versionName.
permissions:
  contents: write

# Play accepts one edit per app at a time; queue uploads instead of running them in parallel.
concurrency:
  group: play-closed-testing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_SECRETS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build-release.ps1 derives versionCode from the full commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Mobile tests
        run: dotnet test androidNet.Tests/BudgetPilot.Mobile.Tests.csproj -m:1

      - name: Skip notice
        if: env.HAS_PLAY_SECRETS != 'true'
        run: echo "::notice::Play secrets are not configured; skipping signed build and upload."

      - name: Install Android workload and SDK
        if: env.HAS_PLAY_SECRETS == 'true'
        working-directory: androidNet
        run: |
          dotnet workload restore BudgetPilot.Mobile.csproj
          dotnet build BudgetPilot.Mobile.csproj -f net10.0-android36.1 -t:InstallAndroidDependencies \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Restore upload key
        if: env.HAS_PLAY_SECRETS == 'true'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed bundle
        if: env.HAS_PLAY_SECRETS == 'true'
        shell: pwsh
        # androidNet/global.json pins the .NET 10 SDK; the repo root pins .NET 8.
        working-directory: androidNet
        env:
          BUDGETPILOT_KEYSTORE: ${{ runner.temp }}/upload.keystore
          BUDGETPILOT_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          BUDGETPILOT_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          BUDGETPILOT_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          $env:AndroidSdkDirectory = $env:ANDROID_HOME
          $env:JavaSdkDirectory = $env:JAVA_HOME
          ./build-release.ps1 -OutputPath "$env:RUNNER_TEMP/release"
          $aab = Get-ChildItem "$env:RUNNER_TEMP/release" -Filter *-Signed.aab | Select-Object -First 1
          if (-not $aab) { $aab = Get-ChildItem "$env:RUNNER_TEMP/release" -Filter *.aab | Select-Object -First 1 }
          "AAB=$($aab.FullName)" >> $env:GITHUB_ENV
          "VERSION=1.0.$(git rev-list --count HEAD)" >> $env:GITHUB_ENV

      - name: Write release notes
        if: env.HAS_PLAY_SECRETS == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          git log -1 --format=%s | cut -c1-500 > "$RUNNER_TEMP/whatsnew/whatsnew-de-DE"

      - name: Keep bundle as artifact
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: budgetpilot-${{ env.VERSION }}
          path: ${{ env.AAB }}

      - name: Upload to closed testing (Alpha)
        if: env.HAS_PLAY_SECRETS == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.budgetpilot.mobile
          releaseFiles: ${{ env.AAB }}
          track: alpha
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Create GitHub release
        if: env.HAS_PLAY_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Budget Pilot $VERSION" \
              --notes-file "$RUNNER_TEMP/whatsnew/whatsnew-de-DE"
          fi

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
